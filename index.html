<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Барабан случайного выбора</title>
    <!-- Подключение SDK Telegram WebApp (работает и в обычном браузере / MAX) -->
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            user-select: none;
        }
        body {
            background-color: #191c22;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .app-container {
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 1050px;
            margin: auto;
            min-height: 100vh;
        }
        /* Левая панель */
        .left-panel {
            width: 360px;
            background-color: #23272e;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }
        .title {
            font-size: 20px;
            font-weight: 600;
        }
        .input-group {
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #6495ed;
            background-color: #323842;
            color: #fff;
            outline: none;
        }
        .btn-add {
            padding: 0 16px;
            font-size: 20px;
            font-weight: bold;
            background-color: #6495ed;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #a0a0a0;
        }
        .btn-clear {
            background: none;
            border: 1px solid #555;
            color: #ccc;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-clear:hover {
            border-color: #e74c3c;
            color: #e74c3c;
        }
        .list-box {
            flex: 1;
            overflow-y: auto;
            max-height: 360px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }
        .list-item {
            background-color: #2c313a;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }
        .remove-item {
            color: #888;
            cursor: pointer;
            font-weight: bold;
            padding: 0 6px;
        }
        .remove-item:hover {
            color: #e74c3c;
        }
        .btn-spin {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            background-color: #2ecc71;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: auto;
        }
        .btn-spin:disabled {
            background-color: #646464;
            cursor: not-allowed;
        }
        /* Правая панель (Барабан) */
        .right-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }
        canvas {
            max-width: 100%;
            height: auto;
        }

        /* Адаптация под мобильные экраны (Telegram / MAX на смартфоне) */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column-reverse;
            }
            .left-panel {
                width: 100%;
                border-top-left-radius: 16px;
                border-top-right-radius: 16px;
            }
            .list-box {
                max-height: 180px;
            }
            .right-panel {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="left-panel">
        <div class="title">Введите фамилию:</div>
        <div class="input-group">
            <input type="text" id="nameInput" placeholder="Например: Иванов" maxlength="20">
            <button class="btn-add" id="addBtn">+</button>
        </div>
        <div class="controls-row">
            <span id="countLabel">Участники (0):</span>
            <button class="btn-clear" id="clearBtn">Очистить всё</button>
        </div>
        <div class="list-box" id="namesList"></div>
        <button class="btn-spin" id="spinBtn" disabled>КРУТИТЬ БАРАБАН</button>
    </div>

    <div class="right-panel">
        <canvas id="drumCanvas" width="500" height="500"></canvas>
    </div>
</div>

<script>
    // Инициализация Telegram WebApp (раскрываем на весь экран)
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    const canvas = document.getElementById('drumCanvas');
    const ctx = canvas.getContext('2d');
    const nameInput = document.getElementById('nameInput');
    const addBtn = document.getElementById('addBtn');
    const clearBtn = document.getElementById('clearBtn');
    const namesList = document.getElementById('namesList');
    const countLabel = document.getElementById('countLabel');
    const spinBtn = document.getElementById('spinBtn');

    let names = [];
    let floatingNames = [];
    let isSpinning = false;
    let showWinner = false;
    let winnerName = "";
    let spinSpeed = 0;
    let drumAngle = 0;
    let winnerScale = 0;

    const drumCenter = { x: 250, y: 250 };
    const drumRadius = 215;

    // Генератор честных случайных чисел через Web Crypto API
    function getSecureRandomInt(max) {
        const array = new Uint32Array(1);
        window.crypto.getRandomValues(array);
        return array[0] % max;
    }

    function rebuildDrumItems() {
        floatingNames = names.map(name => ({
            text: name,
            angle: Math.random() * 360,
            radius: 20 + Math.random() * (drumRadius - 70),
            speedMultiplier: 0.7 + Math.random() * 0.7
        }));
    }

    function updateUI() {
        countLabel.textContent = `Участники (${names.length}):`;
        namesList.innerHTML = '';
        names.forEach((name, idx) => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `<span>${idx + 1}. ${name}</span><span class="remove-item" onclick="removeName(${idx})">✕</span>`;
            namesList.appendChild(div);
        });
        spinBtn.disabled = names.length === 0 || isSpinning;
        nameInput.disabled = isSpinning;
        addBtn.disabled = isSpinning;
        clearBtn.disabled = isSpinning;
    }

    window.removeName = function(index) {
        if (isSpinning) return;
        names.splice(index, 1);
        showWinner = false;
        rebuildDrumItems();
        updateUI();
    };

    function addName() {
        const val = nameInput.value.trim();
        if (!val || isSpinning) return;
        names.push(val);
        nameInput.value = '';
        showWinner = false;
        rebuildDrumItems();
        updateUI();
        nameInput.focus();
    }

    addBtn.addEventListener('click', addName);
    nameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') addName();
    });

    clearBtn.addEventListener('click', () => {
        if (isSpinning) return;
        names = [];
        floatingNames = [];
        showWinner = false;
        updateUI();
    });

    spinBtn.addEventListener('click', () => {
        if (names.length === 0 || isSpinning) return;
        isSpinning = true;
        showWinner = false;
        winnerScale = 0;
        spinSpeed = 650 + Math.random() * 300;
        rebuildDrumItems();
        updateUI();
    });

    let lastTime = performance.now();

    function loop(now) {
        const dt = (now - lastTime) / 1000;
        lastTime = now;

        // Физика вращения
        if (isSpinning) {
            drumAngle += spinSpeed * dt;
            spinSpeed -= 220 * dt;

            for (let fn of floatingNames) {
                fn.angle += spinSpeed * fn.speedMultiplier * dt;
                const targetRadius = (spinSpeed > 250) ? (drumRadius - 45) : (drumRadius * 0.5);
                fn.radius += (targetRadius - fn.radius) * 2.0 * dt;
            }

            if (spinSpeed <= 0) {
                spinSpeed = 0;
                isSpinning = false;
                showWinner = true;
                winnerName = names[getSecureRandomInt(names.length)];
                updateUI();

                // Лёгкая вибрация на смартфоне при победе (Telegram HapticFeedback)
                if (window.Telegram?.WebApp?.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                }
            }
        }

        if (showWinner && winnerScale < 1) {
            winnerScale = Math.min(1, winnerScale + 5 * dt);
        }

        // Отрисовка
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Круг барабана
        ctx.beginPath();
        ctx.arc(drumCenter.x, drumCenter.y, drumRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#2c3e50';
        ctx.fill();
        ctx.lineWidth = 8;
        ctx.strokeStyle = '#f1c40f';
        ctx.stroke();

        // Лопасти
        ctx.save();
        ctx.translate(drumCenter.x, drumCenter.y);
        ctx.rotate(drumAngle * Math.PI / 180);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.fillRect(-drumRadius * 0.95, -2, drumRadius * 1.9, 4);
        ctx.rotate(Math.PI / 2);
        ctx.fillRect(-drumRadius * 0.95, -2, drumRadius * 1.9, 4);
        ctx.restore();

        // Летающие фамилии
        ctx.font = 'bold 17px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        for (let fn of floatingNames) {
            const rad = fn.angle * Math.PI / 180;
            const x = drumCenter.x + Math.cos(rad) * fn.radius;
            const y = drumCenter.y + Math.sin(rad) * fn.radius;

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate((fn.angle + 90) * Math.PI / 180);
            ctx.fillText(fn.text, 0, 0);
            ctx.restore();
        }

        // Карточка победителя
        if (showWinner) {
            ctx.save();
            ctx.translate(drumCenter.x, drumCenter.y);
            ctx.scale(winnerScale, winnerScale);

            const cardW = 360, cardH = 130;
            ctx.fillStyle = '#e74c3c';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 5;

            ctx.beginPath();
            ctx.roundRect(-cardW / 2, -cardH / 2, cardW, cardH, 14);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffe6e6';
            ctx.font = '16px sans-serif';
            ctx.fillText('ВЫПАЛА ФАМИЛИЯ:', 0, -28);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 30px sans-serif';
            ctx.fillText(winnerName, 0, 16);

            ctx.restore();
        }

        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
</script>
</body>
</html>
